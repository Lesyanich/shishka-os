  :root{
    --olive:#3d4b32;            /* exact brand green from logo */
    --w:#ffffff;
    --w-soft:rgba(255,255,255,.74);
    --w-dim:rgba(255,255,255,.6);
    --w-line:rgba(255,255,255,.42);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#161c11;}

  .board{
    width:940px;height:1560px;background:var(--olive);position:relative;
    display:flex;flex-direction:column;align-items:center;
    padding:80px 86px 74px;text-align:center;overflow:hidden;
  }
  /* engraved inner frame — Russian-imperial menu feel */
  .frame{position:absolute;inset:30px;border:1px solid var(--w-line);border-radius:3px;
    pointer-events:none;}
  .frame::after{content:"";position:absolute;inset:7px;border:1px solid rgba(255,255,255,.16);
    border-radius:2px;}
  /* ornament centered on top & bottom frame edges */
  .crown{position:absolute;left:50%;transform:translateX(-50%);color:var(--w);z-index:2;}
  .crown.top{top:18px;}
  .crown.bot{bottom:18px;}
  .crown svg{width:120px;height:26px;display:block;}

  .logo{width:300px;display:block;margin:10px 0 22px;position:relative;z-index:1;}

  .welcome{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;
    font-size:50px;color:var(--w);line-height:1;}
  .welcome-sub{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:23px;
    letter-spacing:.04em;color:var(--w-soft);margin-top:10px;}

  .flo{color:var(--w);margin:26px 0;}
  .flo svg{width:300px;height:22px;display:block;}

  .hours .k{font-family:'Jost',sans-serif;font-weight:400;font-size:19px;
    letter-spacing:.46em;padding-left:.46em;color:var(--w-soft);}
  .hours .time{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:58px;
    letter-spacing:.05em;color:var(--w);line-height:1.05;margin-top:4px;}
  .hours .th{font-family:'Noto Sans Thai',sans-serif;font-weight:300;font-size:19px;
    color:var(--w-dim);margin-top:6px;letter-spacing:.02em;}

  .sectitle{font-family:'Jost',sans-serif;font-weight:400;font-size:20px;
    letter-spacing:.5em;padding-left:.5em;color:var(--w);}
  .sectitle .th{display:block;font-family:'Noto Sans Thai',sans-serif;font-weight:300;
    font-size:17px;letter-spacing:0;color:var(--w-dim);margin-top:7px;}

  .offer{display:flex;justify-content:center;gap:58px;margin-top:30px;}
  .offer .it{display:flex;flex-direction:column;align-items:center;gap:14px;width:160px;}
  .offer .it svg{width:70px;height:70px;color:var(--w);}
  .offer .it .lab{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;
    font-size:29px;color:var(--w);line-height:1;}
  .offer .it .th{font-family:'Noto Sans Thai',sans-serif;font-weight:300;font-size:17px;
    color:var(--w-dim);}

  .amen{display:flex;justify-content:center;gap:40px;}
  .amen .ic{width:84px;height:84px;border-radius:50%;border:1px solid var(--w-line);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;}
  .amen .ic svg{width:38px;height:38px;color:var(--w);}
  .amen .ic .t{font-family:'Jost',sans-serif;font-weight:400;font-size:10px;
    letter-spacing:.16em;padding-left:.16em;color:var(--w-dim);}

  .door{position:absolute;left:50%;bottom:48px;transform:translateX(-50%);z-index:2;
    border:1px solid var(--w-line);border-radius:7px;padding:11px 38px;
    display:flex;flex-direction:column;align-items:center;gap:0;background:var(--olive);}
  .door .slidearrow{width:54px;height:15px;color:var(--w-soft);margin-bottom:5px;}
  .door .th{font-family:'Noto Sans Thai',sans-serif;font-weight:400;font-size:22px;
    color:var(--w-soft);line-height:1.15;margin-top:2px;}
  .door .en{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:32px;
    letter-spacing:.26em;padding-left:.26em;color:var(--w);line-height:1.1;}
  .door .ru{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:400;
    font-size:16px;letter-spacing:.06em;color:var(--w-dim);margin-top:1px;}

  .motto{margin-top:64px;}
  .motto .en{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:400;
    font-size:32px;letter-spacing:.02em;color:var(--w-soft);line-height:1;}
  .motto .ru{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:400;
    font-size:18px;letter-spacing:.1em;color:var(--w-dim);margin-top:9px;}
  .spacer{flex:1;}
</style>
</head>
<body>
