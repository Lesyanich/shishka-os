name: Cleanup listed branches (one-shot)

# Deletes ONLY the explicit branches listed in .github/branches-to-delete.txt
# (abandoned, unmerged, no open PR, >6 weeks old). Runs from GitHub's servers
# because the agent session token cannot delete refs (403). A recovery
# manifest (branch -> tip SHA) is kept off-repo; GitHub also restores deleted
# branches for ~90 days. Self-removed after it runs.

on:
  push:
    branches: [chore/tooling/branch-protection-bootstrap]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delete-listed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete branches from .github/branches-to-delete.txt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          list=.github/branches-to-delete.txt
          [ -f "$list" ] || { echo "no list file — nothing to do"; exit 0; }
          deleted=0; missing=0; failed=0
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            case "$name" in main|chore/tooling/branch-protection-bootstrap) echo "guard-skip: $name"; continue;; esac
            if gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$name" >/dev/null 2>&1; then
              echo "deleted: $name"; deleted=$((deleted+1))
            elif ! gh api "repos/${{ github.repository }}/branches/$name" >/dev/null 2>&1; then
              echo "already gone: $name"; missing=$((missing+1))
            else
              echo "FAILED: $name"; failed=$((failed+1))
            fi
          done < "$list"
          echo "== summary: deleted $deleted, already-gone $missing, failed $failed =="
          [ "$failed" -eq 0 ]
