name: Cleanup merged branches (one-shot)

# Deletes remote branches already merged into main, from GitHub's own
# servers (the Anthropic agent proxy / session token cannot delete refs —
# it returns 403; GITHUB_TOKEN with contents:write can).
#
# NOTE: repo settings + branch rulesets (RULE-GIT-HYGIENE layer 3) are
# intentionally NOT here — GITHUB_TOKEN has no `administration` scope, so
# no workflow can apply them. That step needs the owner's admin session
# (see docs/guides/git-workflow-guide.md § 10).
#
# Runs on push to the bootstrap branch; self-removed after it runs.

on:
  push:
    branches: [chore/tooling/branch-protection-bootstrap]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup-merged-branches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete remote branches already merged into main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin --prune --quiet
          deleted=0; kept=0
          for b in $(git for-each-ref --format='%(refname:short)' refs/remotes/origin | grep -v 'origin/HEAD' | grep -vx 'origin/main'); do
            name="${b#origin/}"
            # never delete the bootstrap branch this run lives on
            [ "$name" = "chore/tooling/branch-protection-bootstrap" ] && continue
            if git merge-base --is-ancestor "$b" origin/main; then
              if gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$name" >/dev/null 2>&1; then
                echo "deleted (merged): $name"; deleted=$((deleted+1))
              else
                echo "FAILED to delete: $name"
              fi
            else
              kept=$((kept+1))
            fi
          done
          echo "== summary: deleted $deleted merged branches, kept $kept unmerged =="
