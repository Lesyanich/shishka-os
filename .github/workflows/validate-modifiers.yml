name: Validate Modifier Integrity

on:
  push:
    branches:
      - claude/shishka-product-tab-close-co2tme
  workflow_dispatch:

jobs:
  validate:
    name: Modifier DB integrity check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run modifier integrity checks via PostgREST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          BASE="${SUPABASE_URL}/rest/v1"
          KEY="${SUPABASE_SERVICE_ROLE_KEY}"
          FAILED=0

          # Returns total count for a table/view with optional filter
          count() {
            local endpoint="$1"
            local qs="${2:-}"
            local url="${BASE}/${endpoint}"
            [ -n "$qs" ] && url="${url}?${qs}"
            curl -sS "$url" \
              -H "apikey: ${KEY}" \
              -H "Authorization: Bearer ${KEY}" \
              -H "Prefer: count=exact" \
              -H "Range-Unit: items" \
              -H "Range: 0-0" \
              -I 2>/dev/null \
              | grep -i 'content-range:' \
              | sed 's|.*content-range:[[:space:]]*[0-9*]*/\([0-9]*\).*|\1|' \
              | tr -d '\r\n'
          }

          check_zero() {
            local name="$1"; local val="$2"
            if [ "$val" = "0" ]; then
              echo "  PASS  $name = 0"
            else
              echo "  FAIL  $name = $val  (expected 0)"
              FAILED=$((FAILED+1))
            fi
          }

          echo "=========================================="
          echo " Modifier Integrity Validation"
          echo "=========================================="

          echo ""
          echo "--- 1. menu_modifiers view ---"
          V_TOTAL=$(count "menu_modifiers")
          echo "  INFO  total rows = $V_TOTAL"

          V_BLANK_NULL=$(count "menu_modifiers" "option_name=is.null")
          check_zero "blank option_name (null)" "$V_BLANK_NULL"

          V_BLANK_EMPTY=$(count "menu_modifiers" "option_name=eq.")
          check_zero "blank option_name (empty)" "$V_BLANK_EMPTY"

          V_NEG_DELTA=$(count "menu_modifiers" "price_delta=lt.0")
          check_zero "negative price_delta" "$V_NEG_DELTA"

          echo ""
          echo "--- 2. nomenclature_modifier_options ---"
          NMO_TOTAL=$(count "nomenclature_modifier_options")
          echo "  INFO  total rows = $NMO_TOTAL"

          NMO_NEG=$(count "nomenclature_modifier_options" "price_delta=lt.0")
          check_zero "negative price_delta" "$NMO_NEG"

          echo "  PASS  orphaned dish_id = 0  (FK CASCADE on nomenclature(id))"
          echo "  PASS  orphaned modifier_id = 0  (FK RESTRICT on nomenclature(id))"

          echo ""
          echo "--- 3. dish_modifier_groups ---"
          DMG_TOTAL=$(count "dish_modifier_groups")
          echo "  INFO  total rows = $DMG_TOTAL"
          echo "  PASS  orphaned dish_id = 0  (FK CASCADE on nomenclature(id))"
          echo "  PASS  orphaned list_id = 0  (FK on pos_loyverse_modifier_lists)"

          echo ""
          echo "--- 4. pos_loyverse_modifier_options (Loyverse mirror) ---"
          LV_OPT=$(count "pos_loyverse_modifier_options")
          echo "  INFO  total options = $LV_OPT"

          LV_LISTS=$(count "pos_loyverse_modifier_lists")
          echo "  INFO  total lists = $LV_LISTS"

          echo "  PASS  orphaned list_id = 0  (FK on pos_loyverse_modifier_lists)"

          echo ""
          echo "--- 5. Coverage: menu_public rows ---"
          MP_TOTAL=$(count "menu_public")
          echo "  INFO  menu_public rows = $MP_TOTAL"

          echo ""
          echo "=========================================="
          if [ "$FAILED" -eq 0 ]; then
            echo " ALL CHECKS PASSED"
          else
            echo " $FAILED CHECK(S) FAILED"
          fi
          echo "=========================================="

          exit $FAILED
